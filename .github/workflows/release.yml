name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'dev-docs/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: release
        uses: ./.github/actions/release/version

  build-and-test:
    needs: version
    uses: ./.github/workflows/build-and-test.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read

  assemble:
    name: Assemble release assets
    needs: [version, build-and-test]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/release/assemble-assets
        with:
          version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish
    needs: [version, assemble]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/release/publish
        with:
          version: ${{ needs.version.outputs.version }}
          tag: ${{ needs.version.outputs.tag }}
          source_sha: ${{ github.sha }}
          app_id: ${{ vars.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
